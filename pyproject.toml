[project]
name = "solzero"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=1.26",
    "scipy>=1.13",
    "sympy>=1.12",
    "matplotlib>=3.8",
    "omnigent==0.16.0",
    "fastapi>=0.100,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "mujoco==3.14.0",
    "mlflow-skinny==3.16.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "mock/tests"]
pythonpath = ["."]
